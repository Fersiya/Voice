# Номер монитора (0 — первый). Игра лучше всего в оконном или borderless режиме.
monitor = 0

# Область субтитров в пикселях монитора. Подбери через `voice --shot`.
[region]
x = 560
y = 940
w = 800
h = 80

# Как часто читать экран, мс
interval_ms = 250

# Язык OCR (в Windows должен быть установлен языковой пакет с распознаванием текста)
ocr_lang = "ru"

[piper]
exe = "piper/piper.exe"
model = "piper/ru_RU-denis-medium.onnx"
# Скорость речи: меньше = быстрее (length_scale в Piper)
length_scale = 0.9
# Голос по умолчанию (номер спикера, если модель многоголосая)
default_speaker = 0

# Голоса по имени говорящего, если в субтитрах формат "Имя: текст".
# Работает с многоголосыми моделями Piper.
[voices]
# "Майкл" = 1
# "Тревор" = 2
# "Франклин" = 3
